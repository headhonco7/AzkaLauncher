name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Prod Debug APK
        run: ./gradlew assembleProdDebug

      - name: Show generated BuildConfig (prodDebug)
        run: |
          echo "=== core:network BuildConfig (prodDebug) ==="
          sed -n '1,120p' core/network/build/generated/source/buildConfig/prod/debug/com/karuhun/core/network/BuildConfig.java || true
          echo "=== app BuildConfig (prodDebug) ==="
          find . -path "*build/generated/source/buildConfig/prod/debug*/**/BuildConfig.*" -maxdepth 8 -print || true
          grep -R "APP_BASE_URL" -n core/network/build/generated/source/buildConfig/prod/debug/com/karuhun/core/network/BuildConfig.java || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            **/build/outputs/apk/prod/debug/*.apk
